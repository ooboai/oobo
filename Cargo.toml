[package]
name = "oobo"
version = "1.1.0"
edition = "2021"
authors = ["Oobo Contributors"]
description = "Context beyond the diff  --  captures AI sessions, tokens, code attribution, and enables semantic code search across your commits"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/ooboai/oobo"
homepage = "https://oobo.ai"
readme = "README.md"
keywords = ["git", "ai", "developer-tools", "attribution", "cli"]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://docs.rs/oobo"

[lib]
name = "oobo"
path = "src/lib.rs"

[[bin]]
name = "oobo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt", "macros"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
ratatui = "0.30"
crossterm = "0.29"
tiktoken-rs = "0.6"
thiserror = "2"
regex = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
sonar-core = { path = "../sonar/crates/core" }
ctrlc = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1.11.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
