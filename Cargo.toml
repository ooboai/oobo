[package]
name = "oobo"
version = "0.1.15"
edition = "2021"
authors = ["Oobo Contributors"]
description = "Git decorator for humans and agents — captures AI sessions, tokens, costs, and code attribution alongside your commits"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/ooboai/oobo"
homepage = "https://oobo.ai"
readme = "README.md"
keywords = ["git", "ai", "developer-tools", "attribution", "cli"]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://docs.rs/oobo"

[lib]
name = "oobo"
path = "src/lib.rs"

[[bin]]
name = "oobo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
dirs = "6"
dialoguer = "0.11"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
console = "0.15"
ratatui = "0.30"
crossterm = "0.28"
tiktoken-rs = "0.6"
libc = "0.2"
thiserror = "2"
regex = "1"
resvg = "0.47.0"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
